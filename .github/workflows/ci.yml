# Headroom CI (Requirement 4).
# Runs on every push to any branch and on every pull request, including pull requests
# from forks. No AWS credentials, no secrets and no EIA_API_KEY are configured or
# referenced, and no step deploys, bootstraps or writes to an AWS account
# (Requirements 4.2, 4.3, 6.11). That is what makes running untrusted pull requests
# safe: the `pull_request` event gives a fork's code a read-only token and no secrets.
# Never switch it to `pull_request_target`, which runs with this repository's
# permissions and secrets.
#
# The job's check name is "ci"; the default branch's ruleset should require it.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # web/package.json engines requires ^20.19.0 || >=22.12.0 (Vite 8).
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '^20.19.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/package-lock.json

      # pytest.ini sets testpaths = sim/tests.
      - name: pytest
        run: |
          python -m pip install -r sim/requirements.txt -r analyst/requirements.txt
          pytest -q

      # Offline from the committed data/raw cache (load_all(offline=True)):
      # no network and no EIA_API_KEY. Regenerates web/public/scenarios/*.json
      # for the web build; CI does not commit them.
      - name: build scenarios (offline, from committed cache)
        run: python -m sim.run_scenarios

      # The stress file ships as committed, so it must match a fresh build. Runs apart from
      # pytest because a full build makes over 900 engine runs.
      - name: check stress results (offline, from committed cache)
        run: python -m sim.stress --check

      # Must run before cdk synth: the stack bundles ../web/dist.
      - name: web build
        working-directory: web
        run: npm ci && npm run build

      # vitest (pure lib/ tests; the build above already type-checked them).
      - name: web tests
        working-directory: web
        run: npm test

      # The analyst's Lambda bundle, built the way CloudShell builds it. CI is the only
      # place it can run before a deploy, so the check runs it on Linux and Python 3.12,
      # with a scripted model. No AWS.
      - name: setup python for the Lambda runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build and check the analyst bundle
        run: |
          python scripts/build_analyst.py
          python scripts/check_analyst_bundle.py

      # Must run after both builds: the stack bundles ../web/dist and the analyst.
      - name: cdk synth
        working-directory: infra
        run: npm ci && npx cdk synth --quiet

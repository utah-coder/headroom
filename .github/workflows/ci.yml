# Headroom CI (Requirement 4).
# Runs on every push to any branch. No AWS credentials, no secrets and no
# EIA_API_KEY are configured or referenced, and no step deploys, bootstraps or
# writes to an AWS account (Requirements 4.2, 4.3, 6.11).
name: ci

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # web/package.json engines requires ^20.19.0 || >=22.12.0 (Vite 8).
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '^20.19.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/package-lock.json

      # pytest.ini sets testpaths = sim/tests.
      - name: pytest
        run: |
          python -m pip install -r sim/requirements.txt
          pytest -q

      # Offline from the committed data/raw cache (load_all(offline=True)):
      # no network and no EIA_API_KEY. Regenerates web/public/scenarios/*.json
      # for the web build; CI does not commit them.
      - name: build scenarios (offline, from committed cache)
        run: python -m sim.run_scenarios

      # Must run before cdk synth: the stack bundles ../web/dist.
      - name: web build
        working-directory: web
        run: npm ci && npm run build

      - name: cdk synth
        working-directory: infra
        run: npm ci && npx cdk synth --quiet
